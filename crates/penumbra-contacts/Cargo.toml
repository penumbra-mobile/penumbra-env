[package]
name = "penumbra-contacts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Material 3 Expressive Contacts App for Penumbra Mobile OS"

[[bin]]
name = "penumbra-contacts"
path = "src/main.rs"

[dependencies]
penumbra-services = { path = "../penumbra-services" }
slint = { version = "1.18", default-features = false, features = ["backend-winit", "compat-1-2", "image-default-formats", "renderer-software", "std"] }
i-slint-common = { version = "1.18", features = ["fontconfig-dlopen"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
slint-build = "1.18"

