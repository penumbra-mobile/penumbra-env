[package]
name = "penumbra-services"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Hardware D-Bus Bridge (UPower, NetworkManager, SensorProxy) with Mock Fallbacks"

[dependencies]
zbus = { version = "5.5", default-features = false, features = ["async-io", "blocking-api"] }
tokio = { version = "1.38", features = ["rt", "sync", "time", "macros"] }
futures-util = "0.3"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
