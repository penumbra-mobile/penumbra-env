[package]
name = "penumbra-desktop-shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Wayland Desktop Convergence Shell (Top Panel, Dock, Launcher) built with Slint and layer-shell-slint"

[dependencies]
layer-shell-slint = { path = "../layer-shell-slint" }
penumbra-services = { path = "../penumbra-services" }
penumbra-shell = { path = "../penumbra-shell" }
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "image-default-formats", "renderer-software", "std"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "sync", "time"] }
freedesktop-desktop-entry = "0.8.4"
freedesktop-icons = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wayland-client = "0.31"

[build-dependencies]
slint-build = "1.18"
